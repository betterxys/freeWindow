name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: swift build + test (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: FreeWindow
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Test runner
        run: swift run FreeWindowTestRunner

      - name: Release build (smoke)
        run: swift build -c release
